<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SynapseMed | Residência OS</title>
    <meta name="description" content="Sistema de estudos e priorização adaptativa com análise automática de provas dos últimos 5 anos (USP-RP, USP-SP, UNICAMP, ENAMED e HIAE) e matriz de incidência institucional." />
    <meta property="og:title" content="SynapseMed | Residência OS" />
    <meta property="og:description" content="Sistema de estudos e priorização adaptativa com análise automática de provas dos últimos 5 anos (USP-RP, USP-SP, UNICAMP, ENAMED e HIAE) e matriz de incidência institucional." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica o tema escuro antes da renderização (evita piscar o claro). -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('synapsemed_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Geist:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
